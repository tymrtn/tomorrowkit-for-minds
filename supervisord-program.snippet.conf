[program:tomorrowkit]
command=python3 system/services/oom_priority/bin/oom_tag_service.py user bash -c "python3 system/scripts/forward_port.py --url http://localhost:8090 --name tomorrowkit && uv run tomorrowkit"
directory=/home/user/workspace
autostart=true
autorestart=true
startretries=1000000
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/tomorrowkit-stdout.log
stderr_logfile=/var/log/supervisor/tomorrowkit-stderr.log
stdout_logfile_maxbytes=10MB
