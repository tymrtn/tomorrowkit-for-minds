[project]
name = "tomorrowkit"
version = "0.1.0"
description = "Tomorrowkit orientation and provisional patent matter workspace"
readme = "README.md"
license = { file = "LICENSE.md" }
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "flask-sock>=0.7",
    "imbue-common",
    "loguru>=0.7",
    "pydantic>=2.0",
    "werkzeug>=3.0",
]

[dependency-groups]
dev = [
    "import-linter>=2.0",
    "inline-snapshot>=0.20",
    "pyright>=1.1.400",
    "pytest>=8.0",
]

[project.scripts]
tomorrowkit = "tomorrowkit.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tomorrowkit"]
