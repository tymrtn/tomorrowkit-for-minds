name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: uv sync --all-groups
      - run: uv run pytest
      - run: uv run pyright src/tomorrowkit
