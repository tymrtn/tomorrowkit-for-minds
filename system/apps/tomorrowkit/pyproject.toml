[project]
name = "tomorrowkit"
version = "0.3.0"
description = "Tomorrowkit: a private, conversational invention record beside the chat"
readme = "README.md"
license = "LicenseRef-FCL-1.0-MIT"
requires-python = ">=3.11"
dependencies = [
    "click>=8.0",
    "flask>=3.0",
    "flask-sock>=0.7",
    "imbue-common",
    "loguru>=0.7",
    "pydantic>=2.0",
    "werkzeug>=3.0",
]

[project.scripts]
tomorrowkit = "tomorrowkit.runner:main"
tomorrowkit-workspace = "tomorrowkit.agent_tools:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tomorrowkit"]
